name: Deploy Firebase backend
"on":
  workflow_dispatch:
    inputs:
      deploy_security_rules:
        description: Deploy Firestore indexes and security rules after migration
        type: boolean
        default: false
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy_to_prod
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: functions/yarn.lock

      - name: Install dependencies
        run: |
          cd functions
          yarn install --frozen-lockfile

      - uses: w9jds/setup-firebase@main
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
      - name: Deploy functions
        run: firebase deploy --only functions

      - name: Deploy indexes and security rules
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_security_rules
        run: firebase deploy --only firestore:rules,firestore:indexes,storage
